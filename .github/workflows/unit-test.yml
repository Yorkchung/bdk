  # ------------------------------------------------------------

  # 其他模組測試
  test-others:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    - run: npm ci
    - run: npm run build:console

    - name: Run other tests
      run: npm run test:others

    - name: Check others coverage
      run: |
        if [ -f "./coverage/others/lcov.info" ]; then
          echo "Others coverage OK"
          wc -l ./coverage/others/lcov.info
