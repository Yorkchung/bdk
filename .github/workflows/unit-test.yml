        cache: 'npm'
    - run: npm ci
    - run: npm run build:console

    - name: Install solc 0.8.17
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip curl
        pip3 install solc-select
        solc-select install 0.8.17
        solc-select use 0.8.17
        solc --version

    - name: Run Besu tests
      run: npm run test:besu:dir

    - name: Check Besu coverage
      run: |
        if [ -f "./coverage/besu/lcov.info" ]; then
          echo "Besu coverage OK"
          wc -l ./coverage/besu/lcov.info
        else
          echo "Besu coverage missing"
          ls -la ./coverage/
        fi

    - name: Check Besu JSON report
      run: |
        if [ -f "./reports/besu.json" ]; then
          echo "Besu JSON report generated"
          ls -lh ./reports/besu.json
        else
          echo "Besu JSON report missing"
          ls -la ./reports/ || echo "reports directory not found"
        fi

    - name: Upload Besu coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-besu
        path: ./coverage/besu/lcov.info
        retention-days: 1

    - name: Upload Besu JSON report
      uses: actions/upload-artifact@v4
      with:
        name: mocha-besu
        path: ./reports/besu.json
        retention-days: 1

  # ------------------------------------------------------------

  # ETH/Quorum 模組測試
