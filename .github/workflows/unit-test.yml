name: unit-test

on:
  push:
    branches: [ master ]
  # pull_request:
  #   branches: [ master ]

jobs:
  # Fabric 模組測試
  test-fabric:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    - run: npm ci
    - run: npm run build:console

    - name: Install solc 0.8.17
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip curl
        pip3 install solc-select
        solc-select install 0.8.17
        solc-select use 0.8.17
        solc --version

    - name: Run Fabric tests
      run: npm run test:fabric:dir

    - name: Check Fabric coverage
      run: |
        if [ -f "./coverage/fabric/lcov.info" ]; then
          echo "Fabric coverage OK"
          wc -l ./coverage/fabric/lcov.info
        else
          echo "Fabric coverage missing"
          ls -la ./coverage/
        fi

    - name: Check Fabric JSON report
      run: |
        if [ -f "./reports/fabric.json" ]; then
          echo "Fabric JSON report generated"
          ls -lh ./reports/fabric.json
        else
          echo "Fabric JSON report missing"
          ls -la ./reports/ || echo "reports directory not found"
        fi

    - name: Upload Fabric coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-fabric
        path: ./coverage/fabric/lcov.info
        retention-days: 1

    - name: Upload Fabric JSON report
      uses: actions/upload-artifact@v4
      with:
        name: mocha-fabric
        path: ./reports/fabric.json
        retention-days: 1

  # ETH/Besu 模組測試
  test-besu:
